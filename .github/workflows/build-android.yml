name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create .env
        run: |
          echo "https://zwaziqlhiotcmkqgxtsl.supabase.co=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3YXppcWxoaW90Y21rcWd4dHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1ODkxMzMsImV4cCI6MjEwNDE2NTEzM30.DztA04Caqv7mvdxmWutqzbPgL2xm_95GpUJtsRh-Nco }}" >> .env

      - name: Install dependencies
        run: npm install

      - name: Prebuild
        run: npx expo prebuild --platform android

      - name: Build APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
